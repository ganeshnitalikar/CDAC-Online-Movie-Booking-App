# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080

# ============================================
# DATABASE CONFIGURATION (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT CONFIGURATION (HMAC Secret)
# ============================================
# IMPORTANT: In production, use a strong 256-bit secret and store securely
jwt.secret=your-256-bit-secret-key-must-be-at-least-32-characters-long

# ============================================
# RAZORPAY CONFIGURATION
# ============================================
# Get these from your Razorpay Dashboard
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=your_razorpay_secret_key
razorpay.webhook.secret=your_webhook_secret

# ============================================
# BOOKING CONFIGURATION
# ============================================
# Seat lock duration in minutes
booking.seat.lock.duration.minutes=10

# ============================================
# SCHEDULING CONFIGURATION
# ============================================
# Enable scheduling for expired booking cleanup
spring.task.scheduling.pool.size=2

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.moviebooking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
